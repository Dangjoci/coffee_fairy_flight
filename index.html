<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>향기 순찰 — 커피요정 비행</title>
<style>
  html,body{margin:0;height:100%;background:#1a1420;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Apple SD Gothic Neo","Malgun Gothic",monospace;color:#f3e6d3}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column}
  #stage{position:relative;flex:1;min-height:0;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  #hud{pointer-events:none}
  .tag{position:absolute;top:8px;padding:3px 7px;background:rgba(26,20,32,.72);border:1px solid rgba(243,230,211,.35);
    font-size:11px;letter-spacing:.08em;pointer-events:none}
  #mode{left:8px}#stat{right:8px}
  #score{left:50%;transform:translateX(-50%)}
  #bar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(26,20,32,.82);display:none;align-items:center;
    gap:12px;padding:4px 10px;font-size:10px;white-space:nowrap;letter-spacing:.06em;border:1px solid rgba(243,230,211,.25)}
  .playing #bar{display:flex}
  .cock #bar{bottom:auto;top:34px}
  #bar b{letter-spacing:.12em}
  #bar kbd{font:inherit;color:#ffb14a;margin-right:5px}
  #bar span{opacity:.9}
  .touch #bar{left:8px;bottom:auto;top:36px;transform:none;padding:0;border:0;background:none}
  .touch #bar .hint,.touch #bar b,.touch #camN{display:none}
  #snd{font:inherit;color:inherit;background:rgba(26,20,32,.72);border:1px solid rgba(243,230,211,.4);padding:3px 8px}
  .btn{position:absolute;display:none;align-items:center;justify-content:center;border-radius:50%;
    background:rgba(26,20,32,.55);border:2px solid rgba(243,230,211,.6);color:#f3e6d3;font-size:12px;
    font-family:inherit;touch-action:none}
  .btn.on{background:rgba(243,160,120,.8)}
  .touch .btn{display:flex}
  #bBoost{right:16px;bottom:20px;width:78px;height:78px}
  #bFire{right:104px;bottom:14px;width:66px;height:66px}
  #bRoll{right:30px;bottom:108px;width:58px;height:58px}
  #bCam{right:8px;top:40px;width:50px;height:50px;border-radius:8px}
  #stick{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;
    border:2px solid rgba(243,230,211,.4);display:none;pointer-events:none}
  #stick i{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
    background:rgba(243,230,211,.55)}
  #pow{position:absolute;left:0;right:0;top:24%;text-align:center;pointer-events:none;opacity:0;
    font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:900;font-size:min(13vw,64px);
    color:#fff3d6;letter-spacing:.02em;
    text-shadow:3px 3px 0 #5a3420,-3px 3px 0 #5a3420,3px -3px 0 #5a3420,-3px -3px 0 #5a3420,0 6px 0 #3a2418}
  #pow.go{animation:pow .7s ease-out}
  @keyframes pow{0%{opacity:1;transform:scale(.3) rotate(-14deg)}18%{opacity:1;transform:scale(1.25) rotate(-7deg)}
    35%{transform:scale(1) rotate(-7deg)}75%{opacity:1;transform:scale(1) rotate(-7deg)}100%{opacity:0;transform:scale(1.1) rotate(-7deg)}}
  @media (prefers-reduced-motion:reduce){#pow.go{animation-duration:.01s}}
  #start{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(rgba(26,20,32,0),rgba(26,20,32,.88) 30%);display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end;padding-top:70px!important;text-align:center;padding:24px;gap:14px}
  #start h1{margin:0;font-size:30px;letter-spacing:.2em;color:#f7c9a0}
  #start p{margin:0;font-size:13px;line-height:1.7;opacity:.9;max-width:30em}
  #go{font:inherit;font-size:15px;padding:12px 26px;background:#f7c9a0;color:#1a1420;border:0;letter-spacing:.15em}
  #err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
</style>
</head>
<body>
<div id="wrap">
 <div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>
  <div class="tag" id="mode">02 / 추격</div>
  <div class="tag" id="score">🌺 0</div>
  <div class="tag" id="stat">000° 360 KT</div>
  <div id="pow">원두펀치!</div>
  <div id="stick"><i></i></div>
  <button class="btn" id="bCam">시점</button>
  <button class="btn" id="bRoll">빙글</button>
  <button class="btn" id="bFire">펀치</button>
  <button class="btn" id="bBoost">부스트</button>
  <div id="bar">
    <b>☕ 향기 순찰</b>
    <span class="hint"><kbd>마우스</kbd>조종·상승·하강</span>
    <span class="hint"><kbd>클릭</kbd>빙글</span>
    <span class="hint"><kbd>누르기</kbd>부스트</span>
    <span class="hint"><kbd>Space</kbd>시점</span>
    <span class="hint"><kbd>F</kbd>원두펀치</span>
    <button id="snd">소리 꺼짐</button>
    <span id="camN">2/4</span>
  </div>
 </div>
  <div id="start">
    <h1>향기 순찰</h1>
    <p>커피향을 전하는 작고 통통한 요정이에요!<br>무궁화를 모으고, 졸음 구름은 원두펀치로 깨우세요.</p>
    <p id="how"></p>
    <button id="go">날아오르기</button>
  </div>
  <div id="err">이 기기에서 3D 화면을 열 수 없어요.</div>
</div>

function hash(ix,iz){var n=Math.imul(ix,374761393)+Math.imul(iz,668265263)|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967295;}

  var c=fbm(x/3000,z/3000,4)*1.7;
  var land=sstep(0.0,0.3,c);
  var h=c*150-16;

    h+=land*(26*noise(x/420,z/420)+r*r*(110+m*640))+noise(x/110,z/110)*5*land;

  return h;

      s=4+rp*20;ring.scale.set(s,s,s*0.4);ring.position.set(1.5,1,-26-rp*30);
      s=2+rp*30;ring2.scale.set(s,s,s*0.4);ring2.position.set(1.5,1,-22-rp*14);
      for(k=0;k<streaks.length;k++){var sa=k/streaks.length*6.283+1,sr=5+rp*9;streaks[k].visible=rp<0.7;
        streaks[k].position.set(1.5+Math.cos(sa)*sr,1+Math.sin(sa)*sr,-18-rp*40);}
    }
    if(S.punchT<=0){fist.visible=false;ring.visible=ring2.visible=false;for(k=0;k<streaks.length;k++)streaks[k].visible=false;}
  }
  fairy.updateMatrixWorld(true);

  // 날개 끝 궤적
  trT-=dt;var addPt=trT<=0;if(addPt)trT=0.03;
  for(k=0;k<2;k++){var tr=trails[k],tip=fairyPoint(k?48:-48,-4,tmpV);
    if(addPt||!tr.pts.length){tr.pts.unshift(tip.x,tip.y,tip.z);if(tr.pts.length>TRN*3)tr.pts.length=TRN*3;}
    else{tr.pts[0]=tip.x;tr.pts[1]=tip.y;tr.pts[2]=tip.z;}
    var pa=tr.geo.attributes.position.array,np=tr.pts.length/3;
    for(i=0;i<TRN;i++){j=Math.min(i,np-1)*3;pa[i*3]=tr.pts[j]-S.pos.x;pa[i*3+1]=tr.pts[j+1]-S.pos.y;pa[i*3+2]=tr.pts[j+2]-S.pos.z;}
    tr.geo.attributes.position.needsUpdate=true;tr.line.position.copy(S.pos);tr.line.visible=S.started;}

  for(i=0;i<puffs.length;i++){var p=puffs[i];if(p.life<=0)continue;p.life-=dt;
    if(p.life<=0){p.m.visible=false;continue;}k=p.life/p.max;s=(0.7+(1-k)*1.5)*p.g;
    p.m.scale.set(s,s,s);p.m.position.addScaledVector(p.v,dt);p.m.material.uniforms.uA.value=Math.min(1,k*1.6);}

  // 부스트: 엉덩이에서 원두 발사
  if(boost){beanT-=dt;popT-=dt;
    while(beanT<=0){beanT+=0.028;var bb=bbeans[bbI++%bbeans.length];
      fairyPoint(0,-38,tmpV).addScaledVector(fwd,-2);bb.m.position.copy(tmpV);bb.life=bb.max=S.cam===1?0.4:0.8;bb.m.visible=true;
      var back=S.speed*(S.cam===1?0.62:0.3);bb.v.copy(fwd).multiplyScalar(back);
      tmpV2.set((Math.random()-.5),(Math.random()-.5),(Math.random()-.5)).multiplyScalar(34);bb.v.add(tmpV2);
      bb.r.x=(Math.random()-.5)*16;bb.s=(1.2+Math.random()*0.9)*sc;}
    if(popT<=0){popT=0.09;tone(260+Math.random()*120,120,0.06,'square',0.035);}
  }
  for(i=0;i<bbeans.length;i++){var b=bbeans[i];if(b.life<=0)continue;b.life-=dt;
    if(b.life<=0){b.m.visible=false;continue;}k=b.life/b.max;s=b.s*(k<0.35?k/0.35:1);b.m.scale.set(s,s,1);b.v.y-=40*dt;b.m.position.addScaledVector(b.v,dt);b.m.material.rotation+=b.r.x*dt;}

  // 무궁화·졸음 구름
  for(i=0;i<picks.length;i++){var pk=picks[i];pk.rotation.y+=dt*1.2;pk.position.y+=Math.sin(time*2+i)*dt*4;
    if(S.started&&pk.position.distanceToSquared(S.pos)<28*28){addScore(1);tone(880,1320,0.14,'triangle',0.1);burst(pk.position,3,30,0xf9b8d2);place(pk,false,90);}
    else{var dx=pk.position.x-S.pos.x,dz=pk.position.z-S.pos.z;if(dx*dx+dz*dz>3300*3300)place(pk,false,90);}}
  for(i=0;i<sleepers.length;i++){var sl=sleepers[i];sl.position.y+=Math.sin(time*0.8+i*2)*dt*3;s=1+Math.sin(time*1.5+i)*0.05;sl.scale.set(s,1/s,s);
    var ex=sl.position.x-S.pos.x,ez=sl.position.z-S.pos.z;if(ex*ex+ez*ez>3300*3300)place(sl,false,160);}

  // 지형
  updateTerrain(S.pos.x,S.pos.z,false);
  // 그림자
  var alt=S.pos.y-gnd,shx=S.pos.x-SUN.x*alt*0.35,shz=S.pos.z-SUN.z*alt*0.35;
  s=(7-Math.min(4,alt/260))*sc;shadow.scale.set(s,s*0.8,1);shadow.rotation.z=S.yaw;
  shadow.position.set(shx,Math.max(0,height(shx,shz))+2.5,shz);shadow.visible=alt<900;

  // 카메라
  camera.up.set(0,1,0);
  var cock=S.started&&S.cam===2;
  if(cock!==viewOff||(cock&&voK!==IW*10000+IH)){viewOff=cock;voK=IW*10000+IH;if(cock)camera.setViewOffset(IW,IH,0,Math.round(IH*0.1),IW,IH);else camera.clearViewOffset();}
  if(!S.started){var swg=Math.sin(time*0.35)*0.6;
    var prt=innerHeight>innerWidth,cdist=prt?36:27;
    camera.position.set(S.pos.x+(-Math.sin(S.yaw+swg))*cdist,S.pos.y+4,S.pos.z+(-Math.cos(S.yaw+swg))*cdist);
    look.set(S.pos.x,S.pos.y+(prt?-5:1.5),S.pos.z);camera.lookAt(look);camSnap=true;}
  else if(S.cam===0){camera.position.set(S.pos.x,S.pos.y+520,S.pos.z+1);camera.up.set(0,0,-1);camera.lookAt(S.pos);}
  else if(S.cam===1){
    var cd=25+(S.speed-90)*0.07;
    tgt.set(S.pos.x+Math.sin(S.yaw)*cd,S.pos.y+10-S.pitch*12,S.pos.z+Math.cos(S.yaw)*cd);
    if(camSnap)camPos.copy(tgt);else camPos.lerp(tgt,1-Math.exp(-dt*7));
    var cg=Math.max(0,height(camPos.x,camPos.z))+4;if(camPos.y<cg)camPos.y=cg;
    camera.position.copy(camPos);look.copy(S.pos).addScaledVector(fwd,12);look.y+=5;camera.lookAt(look);
    camera.rotateZ(S.bank*0.35);
  }else if(S.cam===2){camera.position.copy(S.pos);camera.quaternion.copy(fairy.quaternion);}
  else{orbit+=dt*0.35;var oa=S.yaw+Math.PI+0.9*Math.sin(orbit);
    camera.position.set(S.pos.x+Math.sin(oa)*28,S.pos.y+4+Math.sin(orbit*0.7)*4,S.pos.z+Math.cos(oa)*28);
    look.copy(S.pos);look.y+=2;camera.lookAt(look);}
  if(S.shake>0){S.shake-=dt;var sk=S.shake*3;camera.position.x+=(Math.random()-.5)*sk;camera.position.y+=(Math.random()-.5)*sk;}
  camSnap=false;
  camera.updateMatrixWorld();updateFairyArt(camera,time,boost,showF,!S.started,S.started&&S.cam===1?-S.bank*62:0);
  sky.position.copy(camera.position);
  cloudMat.uniforms.uCamT.value.set(mod(camera.position.x,CT),camera.position.y,mod(camera.position.z,CT));

  var hd=((-S.yaw*57.2958)%360+360)%360;
  $('stat').textContent=String(Math.round(hd)).padStart(3,'0')+'° '+Math.round(S.speed*4)+' KT';
  drawHud(hd,alt);
  renderer.render(scene,camera);
}
updateTerrain(S.pos.x,S.pos.z,true);
requestAnimationFrame(tick);
})();
</script>
